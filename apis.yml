aid: 10web
name: 10Web
description: >-
  10Web is an AI-powered website builder platform that generates, hosts, and
  manages full WordPress websites on managed infrastructure, powering more than
  two million websites. Its public REST API — the 10Web Website Builder API (V1)
  — lets SaaS, agency, and hosting platforms embed 10Web's AI website generation,
  WordPress hosting, domains, DNS, SSL, backups, and staging as a white-label
  solution. The API exposes 69 operations across websites, AI/Vibe Coding
  content generation, domains and DNS zones, SSL certificates, backups, cache and
  PHP management, subdomains, the page builder, and signed webhooks, all
  authenticated with an x-api-key header against https://api.10web.io. Originally
  added to the API Evangelist network as a Sierra Ventures portfolio lead, this
  profile has been enriched from 10Web's public developer surface.
